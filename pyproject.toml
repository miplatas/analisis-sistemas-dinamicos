[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "analisis-sistemas-dinamicos"
version = "0.1.0"
description = "Herramientas didácticas para el análisis y simulación de sistemas dinámicos"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "sympy", "control"]

[tool.setuptools.packages.find]
include = ["sistemas_dinamicos*"]
